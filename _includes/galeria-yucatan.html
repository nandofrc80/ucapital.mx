{%- assign fy = site.data.yucatan_fotos | where_exp: "f", "f.foto != ''" -%}
{%- if fy.size > 0 -%}
<div class="vida-galeria vida-galeria--{{ fy.size }}">
  {%- for f in fy %}
  <figure class="vida-foto">
    <img src="{{ f.foto | relative_url }}" alt="{{ f.pie }}" loading="lazy">
    <figcaption><span>{{ f.pie }}</span>{% if f.credito != "" %}<small>Foto: {% if f.enlace != "" %}<a href="{{ f.enlace }}" target="_blank" rel="noopener nofollow">{{ f.credito }}</a>{% else %}{{ f.credito }}{% endif %}{% if f.licencia != "" %} · {{ f.licencia }}{% endif %}</small>{% endif %}</figcaption>
  </figure>
  {%- endfor %}
</div>
{%- endif -%}
