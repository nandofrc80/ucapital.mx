# Genera una vista previa del sitio en ramas distintas a main y la guarda en la rama "vista-previa-build" (no publica nada).
name: Vista previa
on:
  push:
    branches-ignore: [main, vista-previa-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Guardar el sitio generado en la rama vista-previa-build
        run: |
          sudo chown -R "$(id -u)" _site
          cd _site
          git init -q -b vista-previa-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Vista previa de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" vista-previa-build
