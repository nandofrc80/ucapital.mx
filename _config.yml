# U·Capital Inmobiliaria — configuración del sitio (Jekyll / GitHub Pages)
title: "U·Capital Inmobiliaria"
description: "Asesoría inmobiliaria en Mérida, Yucatán. Comparamos la oferta completa del mercado para que encuentres el hogar que mereces vivir o tu mejor inversión. Asesoría gratuita para el comprador."
description_en: "Real estate advisory in Mérida, Yucatán, Mexico. We compare the full market so you can find the home you deserve or your best investment — free advice for buyers."
url: "https://ucapital.mx"
lang: es-MX

# Datos de contacto (se usan en todo el sitio)
whatsapp: "529999562850"
telefono: "999 956 2850"
email: "contacto@ucapital.mx"
redes:
  facebook: "https://www.facebook.com/profile.php?id=61561095380449"
  instagram: "https://www.instagram.com/ucapital.inmobiliaria/"
