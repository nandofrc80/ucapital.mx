# Propiedades: cada archivo en _propiedades/ genera su página en /propiedades/<nombre>/
collections:
  propiedades:
    output: true
    permalink: /propiedades/:name/

defaults:
  - scope:
      path: ""
      type: propiedades
    values:
      layout: propiedad

markdown: kramdown
exclude:
  - README.md
  - LEEME.md
  - app.jsx
  - tweaks-panel.jsx
  - i18n.js
